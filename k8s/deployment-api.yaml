kind: Namespace
apiVersion: v1

metadata:
  name: desafio-api

---

kind: Secret
apiVersion: v1

metadata:
  name: api-secret
  namespace: desafio-api

type: Opaque
stringData:
  DATABASE_URL: postgresql://app_user:app_user@db-service.desafio-db.svc.cluster.local:5432/db

---

kind: Deployment
apiVersion: apps/v1

metadata:
  name: api-user-deployment
  namespace: desafio-api

spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: api-user
  template:
    metadata:
      labels:
        app: api-user
    spec:
      containers:
        - name: api-user
          image: kenjidev/api-user:v7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3335
          envFrom:
            - secretRef:
                name: api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/startup
              port: 3335
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3335
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3335
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1

---

kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2

metadata:
  name: api-user-hpa
  namespace: desafio-api

spec:
  scaleTargetRef:
    kind: Deployment
    apiVersion: apps/v1
    name: api-user-deployment
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---

kind: Service
apiVersion: v1

metadata:
  name: api-user-service-external
  namespace: desafio-api

spec:
  type: NodePort
  selector:
    app: api-user
  ports:
    - protocol: TCP
      port: 3335
      targetPort: 3335
      nodePort: 30035

